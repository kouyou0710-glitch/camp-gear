<style>
  * { box-sizing: border-box; }
  body {
    touch-action: manipulation;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    background-color: #F0EEE3;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"><rect width="72" height="72" fill="%23F0EEE3"/><path d="M0 60 L14 40 L22 52 L34 28 L46 52 L58 36 L72 60" fill="none" stroke="%23DAD4BC" stroke-width="2"/><circle cx="60" cy="14" r="5" fill="%23DAD4BC"/></svg>');
    background-repeat: repeat;
    color: #26241F;
    margin: 0;
    padding: 0 0 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px calc(104px + env(safe-area-inset-bottom, 0)); }
  .banner {
    width: 100%;
    height: 130px;
    display: block;
  }
  .header-block { background: #F0EEE3; padding: 10px 4px 0; border-radius: 10px; }
  .hero {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 0; padding: 0 4px 12px;
  }
  .hero-title {
    font-size: 18px; font-weight: 700; color: #1F3A2E; margin: 0; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .hero-icon {
    flex-shrink: 0; width: 46px; height: 46px; border-radius: 12px;
    overflow: hidden; border: 2px solid #1F3A2E;
  }
  .hero-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .progress-line { font-size: 13px; color: #5C5848; margin: 6px 0 20px; }
  .progress-track { height: 6px; border-radius: 4px; background: #E1DDCB; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: #C1592B; border-radius: 4px; transition: width 0.3s ease; }
  .sync-status { font-size: 12px; color: #A24A2A; margin-bottom: 0; display: none; }
  .sync-status.err { display: block; margin-bottom: 10px; }

  .category { background: #FBFAF4; border: 1px solid #E1DDCB; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .category-header {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 12px;
    background: none; border: none; text-align: left; cursor: pointer; font-size: 15px;
  }
  .chevron { color: #8B8672; flex-shrink: 0; transition: transform 0.2s ease; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }
  .category-name { flex: 1; font-weight: 600; color: #26241F; }
  .category-delete {
    color: #8B8672; width: 30px; height: 30px; border-radius: 8px; background: #F0EEE3; border: none;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .category-delete:hover, .category-delete:active { background: #F3E3DA; color: #C1592B; }
  .category-delete:hover { color: #C1592B; background: #F0EEE3; }

  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .badge-decided { background: #1F3A2E; color: #EFEADA; }
  .badge-pending { background: #EADFC0; color: #7A5A1E; }
  .badge-empty { background: #ECE9DC; color: #938F7C; }

  .category-body { padding: 4px 12px 14px; border-top: 1px solid #EFEBDC; display: none; }
  .category-body.open { display: block; }
  .empty-note { font-size: 13px; color: #8B8672; margin: 10px 2px 12px; line-height: 1.5; }

  .candidate { display: flex; gap: 10px; align-items: flex-start; padding: 10px 4px; border-bottom: 1px solid #F0EEE3; }
  .candidate:last-of-type { border-bottom: none; }
  .candidate.decided { background: #F3F6F1; margin: 0 -4px; padding: 10px 8px; border-radius: 8px; border-bottom: none; }
  .campsite-panel-card { background: #FBFAF4; border: 1px solid #E1DDCB; border-radius: 12px; padding: 4px 12px; margin-bottom: 10px; }
  .campsite-panel-card:empty { display: none; }

  .decide-dot {
    width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #C7C2AC; background: #fff;
    flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    color: #fff; padding: 0; cursor: pointer; font-size: 13px;
  }
  .candidate.decided .decide-dot { background: #1F3A2E; border-color: #1F3A2E; }

  .campsite-row { flex-direction: column; align-items: stretch; gap: 6px; }
  .campsite-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: none;
    text-align: left; cursor: pointer; padding: 0; font-size: 14px;
  }
  .campsite-toggle .candidate-name { flex: 1; min-width: 0; }
  .candidate-distance { font-size: 11px; color: #7A5A1E; flex-shrink: 0; white-space: nowrap; }
  .status-btn-row { display: flex; gap: 6px; padding-left: 24px; }
  .status-btn {
    flex: 1; font-size: 11.5px; padding: 6px 4px; border-radius: 7px; border: 1px solid #E1DDCB;
    background: #fff; color: #8B8672; cursor: pointer;
  }
  .status-btn.active-visited { background: #E7EFE5; border-color: #7A9B78; color: #3A5A45; font-weight: 600; }
  .status-btn.active-want { background: #FBEBDD; border-color: #E0A46E; color: #A24A2A; font-weight: 600; }
  .status-btn.active-none { background: #EDEAE0; border-color: #C7C2AC; color: #5C5848; font-weight: 600; }
  .candidate-body-details { display: none; padding-left: 24px; }
  .candidate-body-details.open { display: block; margin-top: 4px; }

  .candidate-body { flex: 1; min-width: 0; }
  .candidate-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .candidate-name { font-size: 14px; font-weight: 600; color: #26241F; }
  .candidate-price { font-size: 12.5px; color: #7A5A1E; flex-shrink: 0; white-space: nowrap; }
  .candidate-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 3px; }
  .candidate-memo { font-size: 12.5px; color: #8B8672; line-height: 1.4; }
  .candidate-link { font-size: 12px; color: #C1592B; text-decoration: none; white-space: nowrap; }

  .row-remove, .row-edit {
    width: 30px; height: 30px; border-radius: 8px; background: #F0EEE3; border: none;
    color: #5C5848; cursor: pointer; flex-shrink: 0; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .row-remove:hover, .row-remove:active { background: #F3E3DA; color: #C1592B; }
  .row-edit:hover, .row-edit:active { background: #E1DDCB; color: #1F3A2E; }

  .add-candidate-btn {
    margin-top: 8px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px; border-radius: 8px; border: 1px dashed #C7C2AC; background: none; color: #5C5848;
    font-size: 13px; cursor: pointer;
  }
  .add-candidate-btn:hover { background: #F0EEE3; }

  .item-form { margin-top: 8px; background: #F5F3E9; border-radius: 10px; padding: 10px; display: none; flex-direction: column; gap: 7px; }
  .item-form.open { display: flex; }
  .field { width: 100%; border: 1px solid #E1DDCB; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; background: #fff; color: #26241F; }
  .field:focus { outline: 2px solid #1F3A2E; outline-offset: 1px; }
  .field-row { display: flex; gap: 7px; }
  .field-price { flex: 0 0 40%; }
  .field-url { flex: 1; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }

  .btn { border: none; border-radius: 7px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #1F3A2E; color: #EFEADA; }
  .btn-ghost { background: none; color: #8B8672; }

  .add-category-form { display: flex; gap: 8px; margin-top: 18px; }
  .add-category-form input { flex: 1; border: 1px solid #D9D4BE; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #FBFAF4; }
  .add-category-form input:focus { outline: 2px solid #1F3A2E; outline-offset: 1px; }
  .add-category-btn {
    flex-shrink: 0; width: 40px; border-radius: 8px; background: #C1592B; color: #fff; border: none;
    cursor: pointer; font-size: 18px;
  }

  .tabs {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    max-width: 640px; margin: 0 auto; background: #FBFAF4;
    border-top: 1px solid #E1DDCB; box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
    padding: 0 4px calc(14px + env(safe-area-inset-bottom, 0));
  }
  .tab-btn {
    background: none; border: none; padding: 12px 1px 10px; font-size: 10.5px; font-weight: 600; line-height: 1.25;
    color: #8B8672; cursor: pointer; border-top: 2px solid transparent; margin-top: -1px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    white-space: nowrap; min-height: 62px; border-radius: 8px;
  }
  .tab-btn:active { background: #F0EEE3; }
  .tab-icon { display: block; }
  .tab-icon svg { width: 23px; height: 23px; display: block; }
  .tab-btn.active { color: #1F3A2E; border-top-color: #1F3A2E; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .section-title { font-size: 15px; font-weight: 700; color: #1F3A2E; margin: 18px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  .section-toggle {
    width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: none;
    padding: 10px 2px; font-size: 15px; font-weight: 700; color: #1F3A2E; cursor: pointer; margin-top: 8px;
    border-top: 1px solid #E1DDCB;
  }
  .section-toggle-body { display: none; }
  .section-toggle-body.open { display: block; }

  .event-card { background: #FBFAF4; border: 1px solid #E1DDCB; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .event-header {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 12px;
    background: none; border: none; text-align: left; cursor: pointer; font-size: 14px;
  }
  .event-date {
    flex-shrink: 0; width: 46px; text-align: center; font-weight: 700; color: #1F3A2E;
    background: #EADFC0; border-radius: 8px; padding: 4px 2px; font-size: 12px; line-height: 1.2;
  }
  .event-date .d { font-size: 16px; display: block; }
  .event-title-wrap { flex: 1; min-width: 0; }
  .event-title { font-weight: 600; color: #26241F; }
  .event-memo-preview { font-size: 12px; color: #8B8672; margin-top: 2px; }
  .event-date-range { font-size: 11px; color: #7A5A1E; margin-top: 1px; }
  .event-actions-row { display: flex; gap: 8px; padding: 0 12px 10px; }
  .event-actions-row .row-edit, .event-actions-row .row-remove { width: auto; height: 30px; padding: 0 12px; font-size: 12.5px; gap: 4px; }
  .event-todo-count { font-size: 11px; color: #7A5A1E; flex-shrink: 0; }

  .event-body { padding: 4px 12px 14px; border-top: 1px solid #EFEBDC; display: none; }
  .event-body.open { display: block; }

  .todo-row { display: flex; align-items: flex-start; gap: 8px; padding: 7px 2px; border-bottom: 1px solid #F0EEE3; }
  .todo-row:last-of-type { border-bottom: none; }
  .todo-check {
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #C7C2AC; background: #fff;
    flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    color: #fff; padding: 0; cursor: pointer; font-size: 11px;
  }
  .todo-row.done .todo-check { background: #1F3A2E; border-color: #1F3A2E; }
  .todo-text { flex: 1; font-size: 13.5px; }
  .todo-row.done .todo-text { color: #A9A48E; text-decoration: line-through; }

  .add-todo-form, .add-event-form { display: flex; gap: 8px; margin-top: 10px; }
  .add-todo-form input, .add-event-form input { flex: 1; border: 1px solid #D9D4BE; border-radius: 8px; padding: 9px 12px; font-size: 13.5px; background: #fff; }
  .add-todo-form input:focus, .add-event-form input:focus { outline: 2px solid #1F3A2E; outline-offset: 1px; }
  .add-todo-btn, .add-event-btn { flex-shrink: 0; width: 38px; border-radius: 8px; background: #C1592B; color: #fff; border: none; cursor: pointer; font-size: 16px; }

  .event-new-form { background: #FBFAF4; border: 1px solid #E1DDCB; border-radius: 12px; padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 7px; }
  .event-new-form input, .event-new-form textarea { width: 100%; border: 1px solid #E1DDCB; border-radius: 7px; padding: 8px 10px; font-size: 13.5px; background: #fff; font-family: inherit; resize: vertical; }
  .event-new-form .field-row { display: flex; gap: 7px; }
  .event-new-form .field-date { flex: 1; }
  .event-new-form-hint { font-size: 11px; color: #8B8672; margin-top: -3px; }

  .weather-card { background: #FBFAF4; border: 1px solid #E1DDCB; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .weather-card-title { font-size: 13px; font-weight: 700; color: #1F3A2E; margin-bottom: 8px; }
  .weather-card-sub { font-size: 11.5px; color: #8B8672; margin-bottom: 8px; }
  .weather-days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .weather-day { flex: 0 0 68px; text-align: center; background: #F5F3E9; border-radius: 8px; padding: 8px 4px; }
  .weather-day .wd-label { font-size: 11px; color: #7A5A1E; font-weight: 600; }
  .weather-day .wd-icon { font-size: 22px; margin: 4px 0; }
  .weather-day .wd-temp { font-size: 12px; color: #26241F; }
  .weather-day .wd-temp .max { font-weight: 700; }
  .weather-day .wd-temp .min { color: #8B8672; }
  .weather-day .wd-rain { font-size: 10.5px; color: #3A6EA5; margin-top: 2px; }
  .home-setup-form { display: flex; flex-direction: column; gap: 8px; }
  .home-setup-form input { border: 1px solid #E1DDCB; border-radius: 7px; padding: 9px 12px; font-size: 13.5px; }

  .news-item { display: block; padding: 11px 4px; border-bottom: 1px solid #F0EEE3; text-decoration: none; }
  .news-item:last-of-type { border-bottom: none; }
  .news-title { font-size: 13.5px; font-weight: 600; color: #26241F; line-height: 1.4; }
  .news-meta { font-size: 11.5px; color: #8B8672; margin-top: 3px; }
  .news-source { color: #7A5A1E; font-weight: 600; }
  .news-refresh-btn { margin-top: 12px; width: 100%; }

  .month-cal { background: #FBFAF4; border: 1px solid #E1DDCB; border-radius: 12px; padding: 12px; margin-bottom: 16px; }
  .month-cal-header { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 14px; font-weight: 700; color: #1F3A2E; margin-bottom: 10px; }
  .cal-nav { background: none; border: none; font-size: 18px; color: #7A5A1E; cursor: pointer; padding: 2px 8px; }
  .month-cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: #8B8672; margin-bottom: 4px; }
  .month-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .month-cal-day { aspect-ratio: 1; border: none; background: none; border-radius: 8px; font-size: 12.5px; color: #26241F; cursor: pointer; position: relative; }
  .month-cal-day.empty { cursor: default; }
  .month-cal-day.has-event::after { content: ""; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: #C1592B; }
  .month-cal-day.today { font-weight: 700; color: #1F3A2E; background: #EADFC0; }
  .month-cal-day.selected { background: #1F3A2E; color: #EFEADA; }
  .month-cal-day.selected.has-event::after { background: #EFEADA; }

  .dash-card { background: #FBFAF4; border: 1px solid #E1DDCB; border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
  .dash-card:active { background: #F3F0E4; }
  .dash-card-label { font-size: 11.5px; color: #8B8672; margin-bottom: 4px; }
  .dash-card-main { font-size: 15px; font-weight: 700; color: #1F3A2E; }
  .dash-card-sub { font-size: 12px; color: #7A5A1E; margin-top: 3px; }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dash-grid .dash-card { margin-bottom: 0; }
  .dash-news-item { display: block; padding: 8px 0; border-bottom: 1px solid #F0EEE3; text-decoration: none; font-size: 13px; color: #26241F; }
  .dash-news-item:last-of-type { border-bottom: none; }
  .dash-activity-item { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid #F0EEE3; font-size: 12.5px; }
  .dash-activity-item:last-of-type { border-bottom: none; }
  .dash-activity-text { color: #26241F; }
  .dash-activity-time { color: #8B8672; flex-shrink: 0; font-size: 11px; }

  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .gallery-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #E1DDCB; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item .gallery-caption {
    position: absolute; left: 0; right: 0; bottom: 0; background: rgba(31,58,46,0.75); color: #EFEADA;
    font-size: 10.5px; padding: 4px 6px; line-height: 1.3;
  }
  .gallery-item-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; }
  .gallery-item-actions button {
    width: 24px; height: 24px; border-radius: 6px; border: none; background: rgba(255,255,255,0.85);
    color: #5C5848; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .gallery-add-card {
    aspect-ratio: 1; border-radius: 10px; border: 1px dashed #C7C2AC; background: none; color: #8B8672;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; gap: 4px;
  }
  .gallery-upload-status { font-size: 12px; color: #8B8672; margin-bottom: 10px; }
  .gallery-controls { margin-bottom: 10px; }
  .gallery-controls select {
    width: 100%; border: 1px solid #E1DDCB; border-radius: 8px; padding: 8px 10px; font-size: 13px;
    background: #FBFAF4; color: #26241F;
  }
  .gallery-event-badge {
    position: absolute; left: 4px; top: 4px; background: rgba(31,58,46,0.85); color: #EFEADA;
    font-size: 9.5px; padding: 2px 6px; border-radius: 999px; max-width: calc(100% - 8px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .gallery-grid.mini { grid-template-columns: repeat(4, 1fr); gap: 6px; }

  .lightbox {
    position: fixed; inset: 0; background: rgba(20, 20, 16, 0.9); display: none;
    align-items: center; justify-content: center; flex-direction: column; z-index: 1000; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 78vh; border-radius: 8px; object-fit: contain; }
  .lightbox-caption { color: #EFEADA; font-size: 14px; margin-top: 12px; text-align: center; padding: 0 12px; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 16px; cursor: pointer;
  }

  .gallery-pending-badge {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(240,238,227,0.9); color: #7A5A1E; font-size: 10.5px; text-align: center; padding: 6px; gap: 4px;
  }
  .gallery-item.pending img { opacity: 0.15; }
  .gallery-item.pending .gallery-pending-badge { display: flex; }
  .gallery-item.pending-failed .gallery-pending-badge { color: #A24A2A; }

  .dash-slideshow { width: 100%; aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; margin-top: 6px; background: #E1DDCB; }
  .dash-slideshow img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>

  <script type="module">
    // ===== GitHubリポジトリ情報 =====
    const OWNER = "kouyou0710-glitch";
    const REPO = "camp-gear";
    const BRANCH = "main";
    const DATA_PATH = "data.json";
    // トークンはコードに書き込まず、この端末のブラウザにだけ保存する
    function getToken() {
      let t = localStorage.getItem("cg_github_token");
      if (!t) {
        t = window.prompt("GitHubのアクセストークンを入力してください(この端末にだけ保存されます)");
        if (t) {
          t = t.trim();
          localStorage.setItem("cg_github_token", t);
        }
      }
      return t || null;
    }
    function resetToken() {
      localStorage.removeItem("cg_github_token");
      location.reload();
    }
    window.resetToken = resetToken;

    const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${DATA_PATH}`;
    const POLL_INTERVAL_MS = 6000;

    const DEFAULT_CATEGORIES = [
      { id: "cat-tent", name: "テント", items: [], decidedId: null },
      { id: "cat-sleep", name: "シュラフ(寝袋)", items: [], decidedId: null },
      { id: "cat-mat", name: "マット", items: [], decidedId: null },
      { id: "cat-pack", name: "バックパック", items: [], decidedId: null },
      { id: "cat-cook", name: "クッカー・調理器具", items: [], decidedId: null },
      { id: "cat-light", name: "ヘッドライト・ランタン", items: [], decidedId: null },
      { id: "cat-furniture", name: "チェア・テーブル", items: [], decidedId: null },
    ];

    let categories = [];
    let events = [];           // { id, title, date, memo, todos: [{id,text,done}] }
    let campsites = { items: [] }; // { id, name, area, price, siteType, url, memo, status: "none"|"visited"|"want" }[]
    let openCampsiteIds = new Set();
    let campsiteSortMode = "default"; // "default" | "status" | "distance"
    const siteDistanceCache = {}; // itemId -> { key, km, loading, error }
    let campsiteAddOpen = false;
    let editingCampsiteId = null;
    const summaryPendingIds = new Set();
    let homeLocation = null; // { label, lat, lon } | null
    let photos = []; // { id, path, caption, date }[]
    let activityLog = []; // { id, text, at }[]
    let galleryUploading = false;
    let galleryUploadStatus = "";
    let galleryFilterEventId = "";
    const DEFAULT_EVENT_TODOS = ["天気を確認する", "サイト予約を確認する"];
    const DEFAULT_PACKING_ITEMS = [
      "テント", "タープ", "ペグ・ハンマー", "シュラフ(寝袋)", "マット",
      "ランタン", "ヘッドライト", "焚き火台", "薪・着火剤",
      "クッカー・食器", "カトラリー", "クーラーボックス", "飲料水",
      "着替え", "レインウェア", "タオル",
      "虫除け・日焼け止め", "救急セット・常備薬", "ゴミ袋", "モバイルバッテリー",
    ];
    let weatherCache = { homeKey: null, homeData: null, homeLoading: false, homeError: null,
                          sites: {} }; // sites[campsiteId] = { key, data, loading, error }
    let newsCache = { items: [], loading: false, error: null, loaded: false, sourceErrors: [] };
    let standaloneTodos = [];  // { id, text, done }
    let openIds = new Set();
    let openEventIds = new Set();
    let calendarMonthOffset = 0;
    let calendarSelectedDate = null;
    let eventAddOpen = false;
    let editingEventId = null;
    let standaloneTodoOpen = false;
    let addingFormOpenFor = null;
    let editingItem = null; // { catId, itemId } | null
    let currentSha = null;
    let lastKnownJson = null;
    const VALID_TABS = ["home", "gear", "campsite", "calendar", "weather", "news", "gallery"];
    let currentTab = VALID_TABS.includes(localStorage.getItem("cg_current_tab")) ? localStorage.getItem("cg_current_tab") : "home";

    function uid(prefix) {
      return `${prefix}-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
    }

    function logActivity(text) {
      activityLog = [{ id: uid("log"), text, at: new Date().toISOString() }, ...activityLog].slice(0, 50);
    }

    function setSync(text, isErr) {
      const el = document.getElementById("syncStatus");
      if (!el) return;
      el.textContent = text;
      el.className = "sync-status" + (isErr ? " err" : "");
    }

    function authHeaders() {
      const token = getToken();
      if (!token) throw new Error("トークンが入力されていません");
      return {
        Authorization: `token ${token}`,
        Accept: "application/vnd.github+json",
      };
    }

    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }
    function base64ToUtf8(b64) {
      return decodeURIComponent(escape(atob(b64)));
    }

    // データファイルを取得。まだ存在しなければ初期値を作成する
    async function fetchData({ silent } = {}) {
      try {
        const res = await fetch(`${API_BASE}?ref=${BRANCH}&t=${Date.now()}`, { headers: authHeaders() });
        if (res.status === 404) {
          categories = DEFAULT_CATEGORIES;
          events = [];
          standaloneTodos = [];
          campsites = { items: [] };
          homeLocation = null;
          photos = [];
          activityLog = [];
          currentSha = null;
          await commitState("init data.json");
          return;
        }
        if (!res.ok) {
          if (!silent) setSync(`読み込み失敗(${res.status}): トークンやリポジトリ名を確認してください`, true);
          return;
        }
        const json = await res.json();
        currentSha = json.sha;
        const text = base64ToUtf8(json.content.replace(/\n/g, ""));
        if (text !== lastKnownJson) {
          lastKnownJson = text;
          const parsed = JSON.parse(text);
          categories = Array.isArray(parsed.categories) ? parsed.categories : [];
          events = Array.isArray(parsed.events) ? parsed.events : [];
          standaloneTodos = Array.isArray(parsed.standaloneTodos) ? parsed.standaloneTodos : [];
          campsites = parsed.campsites && Array.isArray(parsed.campsites.items)
            ? { items: parsed.campsites.items.map(it => ({
                ...it,
                status: it.status || (it.checked ? "want" : "none"),
              })) }
            : { items: [] };
          homeLocation = parsed.homeLocation || null;
          photos = Array.isArray(parsed.photos) ? parsed.photos : [];
          activityLog = Array.isArray(parsed.activityLog) ? parsed.activityLog : [];
          render();
        }
        setSync("同期済み", false);
      } catch (e) {
        if (!silent) setSync("接続エラー: " + (e?.message || e), true);
      }
    }

    // データファイルをGitHubに書き込む(コミット)。現在のcategories/events/standaloneTodosをまとめて保存する
    async function commitState(message) {
      const body = {
        message: message || "update camp gear board",
        content: utf8ToBase64(JSON.stringify({ categories, events, standaloneTodos, campsites, homeLocation, photos, activityLog }, null, 2)),
        branch: BRANCH,
      };
      if (currentSha) body.sha = currentSha;
      const snapshot = { categories, events, standaloneTodos, campsites, homeLocation, photos, activityLog };

      const res = await fetch(API_BASE, {
        method: "PUT",
        headers: { ...authHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (res.status === 409) {
        // 他の人が先に書き込んでいた場合。最新を取得してshaだけ更新し、もう一度だけ試す
        await fetchData({ silent: true });
        body.sha = currentSha;
        const retry = await fetch(API_BASE, {
          method: "PUT",
          headers: { ...authHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!retry.ok) throw new Error("競合が解消できませんでした。もう一度操作してください。");
        const retryJson = await retry.json();
        currentSha = retryJson.content.sha;
        // 自分が保存しようとしていた内容に戻す(fetchDataで上書きされた分を元に戻す)
        categories = snapshot.categories;
        events = snapshot.events;
        standaloneTodos = snapshot.standaloneTodos;
        campsites = snapshot.campsites;
        homeLocation = snapshot.homeLocation;
        photos = snapshot.photos;
        activityLog = snapshot.activityLog;
        lastKnownJson = JSON.stringify(snapshot, null, 2);
        render();
        return;
      }

      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.message || `保存に失敗しました(${res.status})`);
      }
      const resJson = await res.json();
      currentSha = resJson.content.sha;
      lastKnownJson = JSON.stringify(snapshot, null, 2);
    }

        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",

    async function deletePhotoFile(path) {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
      const getRes = await fetch(`${url}?ref=${BRANCH}`, { headers: authHeaders() });
      if (!getRes.ok) return; // すでに無ければ何もしない
      const getJson = await getRes.json();

    function resizeImageToBase64(file, maxDim = 1600, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = () => { img.src = reader.result; };
        reader.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else { width = Math.round(width * (maxDim / height)); height = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve(dataUrl.split(",")[1]); // base64部分のみ
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handlePhotoFiles(fileList, eventId) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;
      galleryUploading = true;

      galleryUploadStatus = `アップロード中... (0/${files.length})`;
      renderGallery();
      renderEvents();

      const newEntries = [];
      for (const file of files) {
        try {
          const base64 = await resizeImageToBase64(file);
          const path = `photos/${uid("img")}.jpg`;
          await uploadPhotoFile(path, base64);
          newEntries.push({ id: uid("photo"), path, caption: "", date: toIsoDate(new Date()), eventId: eventId || null });
        } catch (e) {
          galleryUploadStatus = "一部の写真でエラー: " + (e?.message || e);
        }
        doneCount++;
        galleryUploadStatus = `アップロード中... (${doneCount}/${files.length})`;
        renderGallery();
      }

      galleryUploading = false;
      galleryUploadStatus = newEntries.length > 0 ? "アップロードが完了しました" : (galleryUploadStatus || "");
      if (newEntries.length > 0) logActivity(`写真を${newEntries.length}枚追加しました`);
      await savePhotos([...photos, ...newEntries]);
    }

    function formatDateShort(iso) {
      if (!iso) return { m: "-", d: "-" };
      const [y, m, d] = iso.split("-");
      return { m: `${Number(m)}月`, d: Number(d) };
    }

    function toIsoDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function eventRange(ev) {
      const start = ev.date || "";
      const end = ev.endDate && ev.endDate >= start ? ev.endDate : start;
      return [start, end];
    }

    function dateInEventRange(iso, ev) {
      const [start, end] = eventRange(ev);
      return !!start && iso >= start && iso <= end;
    }

    function shortDate(iso) {
      if (!iso) return "";
      const [, m, d] = iso.split("-");
      return `${Number(m)}/${Number(d)}`;
    }

    function formatRangeLabel(ev) {
      const [start, end] = eventRange(ev);
      if (!start) return "";
      if (start === end) return shortDate(start);
      return `${shortDate(start)} 〜 ${shortDate(end)}`;
    }

    function renderMonthCalendar() {
      const el = document.getElementById("monthCalendar");
      if (!el) return;
      const now = new Date();
      const base = new Date(now.getFullYear(), now.getMonth() + calendarMonthOffset, 1);
      const year = base.getFullYear();
      const month = base.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayIso = toIsoDate(now);

      let cells = "";
      for (let i = 0; i < firstDay; i++) cells += `<div class="month-cal-day empty"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const hasEvent = events.some(ev => dateInEventRange(iso, ev));
        const cls = [
          "month-cal-day",
          hasEvent ? "has-event" : "",
          iso === todayIso ? "today" : "",
          iso === calendarSelectedDate ? "selected" : "",
        ].filter(Boolean).join(" ");
        cells += `<button class="${cls}" data-cal-day="${iso}">${d}</button>`;
      }

      el.innerHTML = `
        <div class="month-cal">
          <div class="month-cal-header">
            <button class="cal-nav" data-cal-nav="-1" aria-label="前の月">‹</button>
            <span>${year}年${month + 1}月</span>
            <button class="cal-nav" data-cal-nav="1" aria-label="次の月">›</button>
          </div>

    // ===== 天気(Open-Meteo。APIキー不要) =====
    async function geocodeQueryOnce(q) {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=ja&format=json`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const json = await res.json();
      return json.results && json.results.length > 0 ? json.results[0] : null;
    }

    async function geocodeAddress(address) {
      let r = await geocodeQueryOnce(address);
      if (!r) {
        // 「山梨県南都留郡道志村」→「道志村」のように、都道府県・郡を取り除いて市区町村名だけで再検索
        const simplified = address.replace(/^.*?[都道府県]/, "").replace(/^.*?郡/, "");
        if (simplified && simplified !== address) {
          r = await geocodeQueryOnce(simplified);
        }
      }
      if (!r) throw new Error("該当する地名が見つかりませんでした。市区町村名だけ(例:道志村)で試してみてください");
      const label = [r.name, r.admin1].filter(Boolean).join(" / ");
      return { label, lat: r.latitude, lon: r.longitude };
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function ensureSiteDistance(item) {
      if (!homeLocation || !item.area) return;
      const cache = siteDistanceCache[item.id] || {};
      const key = `${item.area}|${homeLocation.lat},${homeLocation.lon}`;
      if (cache.key === key || cache.loading) return;
      siteDistanceCache[item.id] = { ...cache, loading: true, error: null };
      try {
        const geo = await geocodeAddress(item.area);
        const km = haversineKm(homeLocation.lat, homeLocation.lon, geo.lat, geo.lon);
        siteDistanceCache[item.id] = { key, km, loading: false, error: null };
      } catch (e) {
        siteDistanceCache[item.id] = { key, km: null, loading: false, error: e?.message || String(e) };
      }
      render();
    }

    async function fetchForecast(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=5`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("天気の取得に失敗しました");
      const json = await res.json();
      return json.daily;
    }

    function weatherEmoji(code) {
      if (code === 0) return "☀️";
      if ([1, 2, 3].includes(code)) return "⛅";
      if ([45, 48].includes(code)) return "🌫️";
      if ([51, 53, 55, 56, 57, 80, 81, 82].includes(code)) return "🌦️";
      if ([61, 63, 65, 66, 67].includes(code)) return "🌧️";
      if ([71, 73, 75, 77, 85, 86].includes(code)) return "🌨️";
      if ([95, 96, 99].includes(code)) return "⛈️";
      return "🌡️";
    }

    function weekdayLabel(iso) {
      const d = new Date(iso + "T00:00:00");
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      return `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]})`;
    }

            <div class="wd-icon">${weatherEmoji(daily.weathercode[i])}</div>

            <div class="wd-rain">☔${daily.precipitation_probability_max[i]}%</div>
          </div>
        `).join("")}</div>`;
      }
      return `
        <div class="weather-card">
          <div class="weather-card-title">${escapeHtml(title)}</div>
          ${sub ? `<div class="weather-card-sub">${sub}</div>` : ""}

    async function ensureHomeWeather() {
      if (!homeLocation) return;
      const key = `${homeLocation.lat},${homeLocation.lon}`;
      if (weatherCache.homeKey === key || weatherCache.homeLoading) return;
      weatherCache.homeLoading = true;
      weatherCache.homeError = null;
      try {
        weatherCache.homeData = await fetchForecast(homeLocation.lat, homeLocation.lon);
        weatherCache.homeKey = key;
      } catch (e) {
        weatherCache.homeError = e?.message || String(e);
      } finally {
        weatherCache.homeLoading = false;
        renderWeatherTab();
      }
    }

    async function ensureSiteWeather(site) {
      if (!site || !site.area) return;
      const cache = weatherCache.sites[site.id] || {};
      const key = site.area;
      if (cache.key === key || cache.loading) return;
      weatherCache.sites[site.id] = { ...cache, loading: true, error: null };
      try {
        const geo = await geocodeAddress(site.area);
        const data = await fetchForecast(geo.lat, geo.lon);
        weatherCache.sites[site.id] = { key, data, loading: false, error: null };
      } catch (e) {
        weatherCache.sites[site.id] = { key, data: null, loading: false, error: e?.message || String(e) };
      }
      renderWeatherTab();
    }

    // ===== ニュースフィード(RSS。CORSプロキシ経由で取得) =====
    const NEWS_SOURCES = [
      { name: "hinata", feed: "https://hinata.me/feed" },
      { name: "BE-PAL", feed: "https://www.bepal.net/feed/" },
      { name: "CAMP HACK", feed: "https://camphack.nap-camp.com/feed" },
      { name: "ハピキャン", feed: "https://happycamper.jp/feed" },
    ];
    const CORS_PROXIES = [
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    ];

    async function fetchViaRss2Json(source) {
      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.feed)}`);
      const json = await res.json().catch(() => null);
      if (!json) throw new Error(`${source.name}: rss2jsonの応答を解析できませんでした`);
      if (json.status !== "ok") throw new Error(`${source.name}: ${json.message || "rss2jsonエラー"}`);
      const items = (json.items || []).slice(0, 8).map(it => ({
        title: it.title || "",
        link: it.link || "",
        pubDate: it.pubDate || "",
        source: source.name,
      }));
      if (items.length === 0) throw new Error(`${source.name}: 記事が0件でした`);
      return items;
    }

    async function fetchViaCorsProxy(source) {
      let lastErr = null;
      for (const buildUrl of CORS_PROXIES) {
        try {
          const res = await fetch(buildUrl(source.feed));
          if (!res.ok) { lastErr = new Error(`HTTP ${res.status}`); continue; }
          const text = await res.text();
          const xml = new DOMParser().parseFromString(text, "text/xml");
          if (xml.querySelector("parsererror")) { lastErr = new Error("XML解析エラー"); continue; }
          const items = Array.from(xml.querySelectorAll("item")).slice(0, 8).map(item => ({
            title: item.querySelector("title")?.textContent || "",
            link: item.querySelector("link")?.textContent || "",
            pubDate: item.querySelector("pubDate")?.textContent || "",
            source: source.name,
          }));
          if (items.length > 0) return items;
          lastErr = new Error("記事が見つかりませんでした");
        } catch (e) {
          lastErr = e;
        }
      }
      throw new Error(`${source.name}: ${lastErr?.message || "取得失敗"}`);
    }

    async function fetchOneFeed(source) {
      try {
        return await fetchViaRss2Json(source);
      } catch (e1) {
        try {
          return await fetchViaCorsProxy(source);
        } catch (e2) {
          throw new Error(`${e1.message} / ${e2.message}`);
        }
      }
    }

    async function loadNews() {
      if (newsCache.loading) return;
      newsCache.loading = true;
      newsCache.error = null;
      newsCache.sourceErrors = [];
      renderNewsTab();

      const results = await Promise.allSettled(NEWS_SOURCES.map(fetchOneFeed));
      let all = [];
      results.forEach((r, i) => {
        if (r.status === "fulfilled") {
          all = all.concat(r.value);
        } else {
          newsCache.sourceErrors.push(r.reason?.message || `${NEWS_SOURCES[i].name}: 取得できませんでした`);
        }
      });
      all.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
      newsCache.items = all.slice(0, 20);
      newsCache.loaded = true;
      newsCache.loading = false;
      if (newsCache.items.length === 0 && newsCache.sourceErrors.length > 0) {
        newsCache.error = "すべての情報源から取得できませんでした。";
      }
      renderNewsTab();
    }

    function formatNewsDate(pubDate) {
      if (!pubDate) return "";
      const d = new Date(pubDate);
      if (isNaN(d.getTime())) return "";
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function renderNewsTab() {
      const el = document.getElementById("newsArea");
      if (!el) return;

      if (!newsCache.loaded && !newsCache.loading) {
        loadNews();
      }

      let body;
      if (newsCache.loading) {
        body = `<p class="empty-note">読み込み中...</p>`;
      } else if (newsCache.items.length > 0) {
        body = newsCache.items.map(item => `
          <a class="news-item" href="${escapeHtml(item.link)}" target="_blank" rel="noreferrer">
            <div class="news-title">${escapeHtml(item.title)}</div>
            <div class="news-meta"><span class="news-source">${escapeHtml(item.source)}</span> ${formatNewsDate(item.pubDate)}</div>
          </a>
        `).join("");
      } else {
        body = `<p class="empty-note">${escapeHtml(newsCache.error || "記事がありません。")}</p>`;
      }

      const sourceErrorsHtml = newsCache.sourceErrors.length > 0
        ? `<p class="empty-note">${newsCache.sourceErrors.map(escapeHtml).join(" / ")}</p>`
        : "";

      el.innerHTML = `
        <div class="weather-card">
          <div class="weather-card-title">キャンプ関連ニュース</div>
          ${body}
          ${sourceErrorsHtml}
          <button class="btn btn-primary news-refresh-btn" id="newsRefreshBtn">更新する</button>
        </div>
      `;

      const refreshBtn = document.getElementById("newsRefreshBtn");
      if (refreshBtn) {
        refreshBtn.addEventListener("click", () => {
          newsCache.loaded = false;
          loadNews();
        });
      }
    }

    function formatActivityTime(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      return sameDay ? hm : `${d.getMonth() + 1}/${d.getDate()}`;
    }

    function renderDashboard() {
      const el = document.getElementById("dashboardArea");
      if (!el) return;

      // 次の予定
      const todayIso = toIsoDate(new Date());
      const upcoming = [...events]
        .filter(ev => ev.date && ev.date >= todayIso)
        .sort((a, b) => a.date.localeCompare(b.date))[0];
      const nextEventHtml = upcoming
        ? `<div class="dash-card-main">${escapeHtml(upcoming.title)}</div><div class="dash-card-sub">${escapeHtml(upcoming.date)}</div>`
        : `<div class="dash-card-main">予定なし</div><div class="dash-card-sub">カレンダーから追加できます</div>`;

      // 未完了Todo数
      const eventTodoIncomplete = events.reduce((sum, ev) => sum + (ev.todos || []).filter(t => !t.done).length, 0);
      const standaloneIncomplete = standaloneTodos.filter(t => !t.done).length;
      const totalIncomplete = eventTodoIncomplete + standaloneIncomplete;

      // ギア決定状況
      const gearTotal = categories.length;
      const gearDecided = categories.filter(c => c.decidedId).length;

      // 天気(自宅、今日分のみ簡易表示)
      let weatherHtml = `<div class="dash-card-main">未設定</div><div class="dash-card-sub">天気タブで自宅エリアを設定</div>`;
      if (homeLocation && weatherCache.homeData) {
        const code = weatherCache.homeData.weathercode?.[0];
        const max = weatherCache.homeData.temperature_2m_max?.[0];
        const min = weatherCache.homeData.temperature_2m_min?.[0];
        weatherHtml = `<div class="dash-card-main">${weatherEmoji(code)} ${Math.round(max)}° / ${Math.round(min)}°</div><div class="dash-card-sub">${escapeHtml(homeLocation.label)}</div>`;
      } else if (homeLocation) {
        weatherHtml = `<div class="dash-card-main">読み込み中...</div>`;
      }

      // 最新ニュース2件
      const newsHtml = newsCache.items.length > 0
        ? newsCache.items.slice(0, 2).map(item => `
            <a class="dash-news-item" href="${escapeHtml(item.link)}" target="_blank" rel="noreferrer">${escapeHtml(item.title)}</a>
          `).join("")
        : `<p class="empty-note">ニュースタブで読み込まれます</p>`;

      // 最新の更新5件
      const recentActivity = [...activityLog].slice(0, 5);
      const activityHtml = recentActivity.length > 0
        ? recentActivity.map(a => `
            <div class="dash-activity-item">
              <span class="dash-activity-text">${escapeHtml(a.text)}</span>
              <span class="dash-activity-time">${formatActivityTime(a.at)}</span>
            </div>
          `).join("")
        : `<p class="empty-note">まだ更新はありません。</p>`;

      el.innerHTML = `
        <div class="dash-card" data-goto-tab="calendar">
          <div class="dash-card-label">次の予定</div>
          ${nextEventHtml}
        </div>
        <div class="dash-grid">
          <div class="dash-card" data-goto-tab="calendar">
            <div class="dash-card-label">未完了Todo</div>
            <div class="dash-card-main">${totalIncomplete}件</div>
          </div>
          <div class="dash-card" data-goto-tab="gear">
            <div class="dash-card-label">ギア決定</div>
            <div class="dash-card-main">${gearDecided} / ${gearTotal}</div>
          </div>
          <div class="dash-card" data-goto-tab="weather">
            <div class="dash-card-label">自宅の天気(今日)</div>
            ${weatherHtml}
          </div>
          <div class="dash-card" data-goto-tab="news">
            <div class="dash-card-label">最新ニュース</div>
            ${newsCache.items[0] ? `<div class="dash-card-main" style="font-size:13px;">${escapeHtml(newsCache.items[0].title)}</div>` : `<div class="dash-card-sub">読み込み中</div>`}
          </div>
        </div>
        <div class="dash-card">
          <div class="dash-card-label">最近の更新</div>
          ${activityHtml}
        </div>
        ${photos.length > 0 ? `
          <div class="dash-card" data-goto-tab="gallery">
            <div class="dash-card-label">思い出フォトスライドショー</div>
            <div class="dash-slideshow">
              <img id="dashSlideImg" src="${escapeHtml(photos[dashboardSlideIndex % photos.length].path)}"
                   alt="キャンプの写真" onclick="event.stopPropagation(); window.openLightbox(this.src, document.getElementById('dashSlideCaption').textContent)" />
            </div>
            <div class="dash-card-sub" id="dashSlideCaption">${escapeHtml(photos[dashboardSlideIndex % photos.length].caption || "")}</div>
          </div>
        ` : ""}
      `;

      el.querySelectorAll("[data-goto-tab]").forEach(card => {
        card.addEventListener("click", () => {
          currentTab = card.getAttribute("data-goto-tab");
          localStorage.setItem("cg_current_tab", currentTab);
          renderTabs();
        });
      });
    }

    function renderCandidate(cat, item) {
      const isDecided = cat.decidedId === item.id;
      return `
        <div class="candidate ${isDecided ? "decided" : ""}">
          <button class="decide-dot" data-decide="${cat.id}|${item.id}">${isDecided ? "✓" : ""}</button>
          <div class="candidate-body">
            <div class="candidate-top">
              <span class="candidate-name">${escapeHtml(item.name)}</span>
              ${item.price ? `<span class="candidate-price">${escapeHtml(item.price)}</span>` : ""}
            </div>
            ${(item.memo || item.url) ? `
              <div class="candidate-meta">
                ${item.memo ? `<span class="candidate-memo">${escapeHtml(item.memo)}</span>` : ""}
                ${item.url ? `<a class="candidate-link" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">リンク</a>` : ""}
              </div>` : ""}
          </div>
          <button class="row-edit" data-edit="${cat.id}|${item.id}" aria-label="編集">✎</button>
          <button class="row-remove" data-remove="${cat.id}|${item.id}">✕</button>
        </div>
      `;
    }

    function renderForm(catId, item) {
      const isEdit = !!item;
      const v = (f) => escapeHtml(item ? (item[f] || "") : "");
      return `
        <form class="item-form open" data-item-form="${catId}" ${isEdit ? `data-edit-item="${item.id}"` : ""}>
          <input class="field field-name" placeholder="商品名(例:ニーモ タニ2P)" data-f="name" value="${v("name")}" />
          <div class="field-row">
            <input class="field field-price" placeholder="価格(任意)" data-f="price" value="${v("price")}" />
            <input class="field field-url" placeholder="URL(任意)" data-f="url" value="${v("url")}" />
          </div>
          <input class="field field-memo" placeholder="メモ(重さ、色、迷ってる理由など)" data-f="memo" value="${v("memo")}" />
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" data-cancel-form="${catId}">キャンセル</button>
            <button type="submit" class="btn btn-primary">${isEdit ? "保存" : "候補に追加"}</button>
          </div>
        </form>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function bindEvents() {
      document.querySelectorAll("[data-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-toggle");
          if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
          render();
        });
      });
      document.querySelectorAll("[data-delete-cat]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-delete-cat");
          saveCategories(categories.filter(c => c.id !== id));
        });
      });
      document.querySelectorAll("[data-add-open]").forEach(btn => {
        btn.addEventListener("click", () => {
          addingFormOpenFor = btn.getAttribute("data-add-open");
          editingItem = null;
          render();
        });
      });
      document.querySelectorAll("[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [catId, itemId] = btn.getAttribute("data-edit").split("|");
          editingItem = { catId, itemId };
          addingFormOpenFor = null;
          render();
        });
      });
      document.querySelectorAll("[data-cancel-form]").forEach(btn => {
        btn.addEventListener("click", () => {
          addingFormOpenFor = null;
          editingItem = null;
          render();
        });
      });
      document.querySelectorAll("[data-item-form]").forEach(form => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const catId = form.getAttribute("data-item-form");
          const editItemId = form.getAttribute("data-edit-item");
          const name = form.querySelector('[data-f="name"]').value.trim();
          if (!name) return;
          const price = form.querySelector('[data-f="price"]').value.trim();
          const url = form.querySelector('[data-f="url"]').value.trim();
          const memo = form.querySelector('[data-f="memo"]').value.trim();

          let next;
          if (editItemId) {
            next = categories.map(c =>
              c.id === catId
                ? { ...c, items: c.items.map(i => i.id === editItemId ? { ...i, name, price, url, memo } : i) }
                : c
            );
          } else {
            next = categories.map(c =>
              c.id === catId ? { ...c, items: [...c.items, { id: uid("item"), name, price, url, memo }] } : c
            );
            const cat = categories.find(c => c.id === catId);
            logActivity(`「${name}」を${cat ? cat.name : "ギア"}の候補に追加しました`);
          }
          addingFormOpenFor = null;
          editingItem = null;
          saveCategories(next);
        });
      });
      document.querySelectorAll("[data-decide]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [catId, itemId] = btn.getAttribute("data-decide").split("|");
          const cat = categories.find(c => c.id === catId);
          const item = cat?.items.find(i => i.id === itemId);
          if (cat && item && cat.decidedId !== itemId) {
            logActivity(`「${item.name}」を${cat.name}に決定しました`);
          }
          const next = categories.map(c =>
            c.id === catId ? { ...c, decidedId: c.decidedId === itemId ? null : itemId } : c
          );
          saveCategories(next);
        });
      });
      document.querySelectorAll("[data-remove]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [catId, itemId] = btn.getAttribute("data-remove").split("|");
          const next = categories.map(c =>
            c.id === catId
              ? { ...c, items: c.items.filter(i => i.id !== itemId), decidedId: c.decidedId === itemId ? null : c.decidedId }
              : c
          );
          saveCategories(next);
        });
      });

      // ===== タブ切り替え =====
      document.querySelectorAll("[data-tab]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentTab = btn.getAttribute("data-tab");
          localStorage.setItem("cg_current_tab", currentTab);
          renderTabs();
        });
      });

      // ===== キャンプ場候補 =====
      const campsiteAddOpenBtn = document.getElementById("campsiteAddOpenBtn");
      if (campsiteAddOpenBtn) {
        campsiteAddOpenBtn.addEventListener("click", () => {
          campsiteAddOpen = true;
          editingCampsiteId = null;
          render();
        });
      }
      document.querySelectorAll("[data-campsite-edit]").forEach(btn => {
        btn.addEventListener("click", () => {
          editingCampsiteId = btn.getAttribute("data-campsite-edit");
          campsiteAddOpen = false;
          render();
        });
      });
      const campsiteCancelBtn = document.getElementById("campsiteCancelBtn");
      if (campsiteCancelBtn) {
        campsiteCancelBtn.addEventListener("click", () => {
          campsiteAddOpen = false;
          editingCampsiteId = null;
          render();
        });
      }
      const campsiteForm = document.getElementById("campsiteForm");
      if (campsiteForm) {
        campsiteForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const editId = campsiteForm.getAttribute("data-edit-campsite");
          const name = campsiteForm.querySelector('[data-cf="name"]').value.trim();
          if (!name) return;
          const area = campsiteForm.querySelector('[data-cf="area"]').value.trim();
          const price = campsiteForm.querySelector('[data-cf="price"]').value.trim();
          const siteType = campsiteForm.querySelector('[data-cf="siteType"]').value.trim();
          const url = campsiteForm.querySelector('[data-cf="url"]').value.trim();
          const memo = campsiteForm.querySelector('[data-cf="memo"]').value.trim();
          let nextItems;
          let newItem = null;
          if (editId) {
            nextItems = campsites.items.map(it => it.id === editId ? { ...it, name, area, price, siteType, url, memo } : it);
          } else {
            newItem = { id: uid("site"), name, area, price, siteType, url, memo, status: "none" };
            nextItems = [...campsites.items, newItem];
            logActivity(`キャンプ場候補「${name}」を追加しました`);
          }
          campsiteAddOpen = false;
          editingCampsiteId = null;
          saveCampsites({ items: nextItems });
          // AIサマリーの自動生成は、外部サイトからは安全に呼び出せないため停止中
          // if (newItem) generateCampsiteSummary(newItem);
        });
      }
      document.querySelectorAll("[data-campsite-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-campsite-toggle");
          if (openCampsiteIds.has(id)) openCampsiteIds.delete(id); else openCampsiteIds.add(id);
          render();
        });
      });
      document.querySelectorAll("[data-campsite-status]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [id, val] = btn.getAttribute("data-campsite-status").split("|");
          const item = campsites.items.find(it => it.id === id);
          const labels = { visited: "行ったことある", want: "行きたい", none: "無印" };
          if (item && item.status !== val) logActivity(`「${item.name}」を「${labels[val]}」にしました`);
          const nextItems = campsites.items.map(it => it.id === id ? { ...it, status: val } : it);
          saveCampsites({ ...campsites, items: nextItems });
        });
      });
      document.querySelectorAll("[data-campsite-remove]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-campsite-remove");
          const nextItems = campsites.items.filter(it => it.id !== id);
          saveCampsites({ items: nextItems });
        });
      });

      // ===== カレンダー: 月表示ナビゲーション =====
      document.querySelectorAll("[data-cal-nav]").forEach(btn => {
        btn.addEventListener("click", () => {
          calendarMonthOffset += Number(btn.getAttribute("data-cal-nav"));
          render();
        });
      });
      document.querySelectorAll("[data-cal-day]").forEach(btn => {
        btn.addEventListener("click", () => {
          const iso = btn.getAttribute("data-cal-day");
          calendarSelectedDate = calendarSelectedDate === iso ? null : iso;
          render();
        });
      });
      const calClearFilter = document.getElementById("calClearFilter");
      if (calClearFilter) {
        calClearFilter.addEventListener("click", () => {
          calendarSelectedDate = null;
          render();
        });
      }

      // ===== カレンダー: イベントの開閉・削除・編集 =====
      document.querySelectorAll("[data-event-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-event-toggle");
          if (openEventIds.has(id)) openEventIds.delete(id); else openEventIds.add(id);
          render();
        });
      });
      document.querySelectorAll("[data-event-delete]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!confirm("この予定を削除しますか?")) return;
          const id = btn.getAttribute("data-event-delete");
          saveEvents(events.filter(ev => ev.id !== id));
        });
      });
      document.querySelectorAll("[data-event-edit]").forEach(btn => {
        btn.addEventListener("click", () => {
          editingEventId = btn.getAttribute("data-event-edit");
          render();
        });
      });
      const eventEditCancelBtn = document.getElementById("eventEditCancelBtn");
      if (eventEditCancelBtn) {
        eventEditCancelBtn.addEventListener("click", () => {
          editingEventId = null;
          render();
        });
      }
      document.querySelectorAll("[data-edit-event-form]").forEach(form => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const id = form.getAttribute("data-edit-event-form");
          const title = form.querySelector('[data-ef="title"]').value.trim();
          if (!title) return;
          const date = form.querySelector('[data-ef="date"]').value;
          const endDateInput = form.querySelector('[data-ef="endDate"]').value;
          const endDate = endDateInput && endDateInput >= date ? endDateInput : date;
          const memo = form.querySelector('[data-ef="memo"]').value.trim();
          const next = events.map(ev => ev.id === id ? { ...ev, title, date, endDate, memo } : ev);
          editingEventId = null;
          saveEvents(next);
        });
      });

      // ===== カレンダー: 新規イベント追加(折りたたみ) =====
      const eventAddOpenBtn = document.getElementById("eventAddOpenBtn");
      if (eventAddOpenBtn) {
        eventAddOpenBtn.addEventListener("click", () => {
          eventAddOpen = true;
          render();
        });
      }
      const eventAddCancelBtn = document.getElementById("eventAddCancelBtn");
      if (eventAddCancelBtn) {
        eventAddCancelBtn.addEventListener("click", () => {
          eventAddOpen = false;
          render();
        });
      }
      const newEventForm = document.getElementById("newEventForm");
      if (newEventForm) {
        newEventForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const title = document.getElementById("newEventTitle").value.trim();
          if (!title) return;
          const date = document.getElementById("newEventDate").value;
          const endDateInput = document.getElementById("newEventEndDate").value;
          const endDate = endDateInput && endDateInput >= date ? endDateInput : date;
          const memo = document.getElementById("newEventMemo").value.trim();
          const defaultTodos = DEFAULT_EVENT_TODOS.map(text => ({ id: uid("todo"), text, done: false }));
          const defaultPacking = DEFAULT_PACKING_ITEMS.map(text => ({ id: uid("pack"), text, done: false }));
          eventAddOpen = false;
          logActivity(`予定「${title}」を追加しました`);
          saveEvents([...events, {
            id: uid("event"), title, date, endDate, memo,
            todos: defaultTodos, packingList: defaultPacking,
            meetingPoint: "", directions: "",
          }]);
        });
      }

      // ===== カレンダー: イベント内todoの追加 =====
      document.querySelectorAll("[data-event-todo-form]").forEach(form => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const eventId = form.getAttribute("data-event-todo-form");
          const input = form.querySelector("[data-todo-input]");
          const text = input.value.trim();
          if (!text) return;
          const next = events.map(ev =>
            ev.id === eventId ? { ...ev, todos: [...(ev.todos || []), { id: uid("todo"), text, done: false }] } : ev
          );
          saveEvents(next);
        });
      });

      // ===== カレンダー: イベント内todoの完了・削除 =====
      document.querySelectorAll("[data-event-todo-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [eventId, todoId] = btn.getAttribute("data-event-todo-toggle").split("|");
          const next = events.map(ev =>
            ev.id === eventId
              ? { ...ev, todos: ev.todos.map(t => t.id === todoId ? { ...t, done: !t.done } : t) }
              : ev
          );
          saveEvents(next);
        });
      });
      document.querySelectorAll("[data-event-todo-remove]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [eventId, todoId] = btn.getAttribute("data-event-todo-remove").split("|");
          const next = events.map(ev =>
            ev.id === eventId ? { ...ev, todos: ev.todos.filter(t => t.id !== todoId) } : ev
          );
          saveEvents(next);
        });
      });

      // ===== カレンダー: 持ち物リストの追加 =====
      document.querySelectorAll("[data-event-packing-form]").forEach(form => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const eventId = form.getAttribute("data-event-packing-form");
          const input = form.querySelector("[data-packing-input]");
          const text = input.value.trim();
          if (!text) return;
          const next = events.map(ev =>
            ev.id === eventId ? { ...ev, packingList: [...(ev.packingList || []), { id: uid("pack"), text, done: false }] } : ev
          );
          saveEvents(next);
        });
      });

      // ===== カレンダー: 持ち物リストの完了・削除 =====
      document.querySelectorAll("[data-event-packing-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [eventId, packId] = btn.getAttribute("data-event-packing-toggle").split("|");
          const next = events.map(ev =>
            ev.id === eventId
              ? { ...ev, packingList: (ev.packingList || []).map(t => t.id === packId ? { ...t, done: !t.done } : t) }
              : ev
          );
          saveEvents(next);
        });
      });
      document.querySelectorAll("[data-event-packing-remove]").forEach(btn => {
        btn.addEventListener("click", () => {
          const [eventId, packId] = btn.getAttribute("data-event-packing-remove").split("|");
          const next = events.map(ev =>
            ev.id === eventId ? { ...ev, packingList: (ev.packingList || []).filter(t => t.id !== packId) } : ev
          );
          saveEvents(next);
        });
      });

      // ===== カレンダー: 集合場所・行き方の保存 =====
      document.querySelectorAll("[data-meeting-form]").forEach(form => {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const eventId = form.getAttribute("data-meeting-form");
          const meetingPoint = form.querySelector('[data-mf="meetingPoint"]').value.trim();
          const directions = form.querySelector('[data-mf="directions"]').value.trim();
          const next = events.map(ev =>
            ev.id === eventId ? { ...ev, meetingPoint, directions } : ev
          );
          saveEvents(next);
        });
      });

      // ===== 写真: 削除・キャプション編集(ギャラリー/予定詳細共通) =====
      document.querySelectorAll("[data-photo-remove]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-photo-remove");
          const target = photos.find(p => p.id === id);
          if (!target) return;
          if (!confirm("この写真を削除しますか?")) return;
          await savePhotos(photos.filter(p => p.id !== id));
          deletePhotoFile(target.path).catch(() => {});
        });
      });
      document.querySelectorAll("[data-photo-caption]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-photo-caption");
          const target = photos.find(p => p.id === id);
          if (!target) return;
          const next = window.prompt("キャプションを入力", target.caption || "");
          if (next === null) return;
          savePhotos(photos.map(p => p.id === id ? { ...p, caption: next.trim() } : p));
        });
      });

      // ===== カレンダー: 予定詳細から直接写真を追加 =====
      document.querySelectorAll("[data-event-photo-input]").forEach(input => {
        input.addEventListener("change", (e) => {
          const eventId = input.getAttribute("data-event-photo-input");
          handlePhotoFiles(e.target.files, eventId);
          e.target.value = "";
        });
      });

      // ===== 単独todo =====
      const standaloneTodoToggle = document.getElementById("standaloneTodoToggle");
      if (standaloneTodoToggle) {
        standaloneTodoToggle.addEventListener("click", () => {
          standaloneTodoOpen = !standaloneTodoOpen;
          render();
        });
      }
      document.querySelectorAll("[data-standalone-todo-toggle]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-standalone-todo-toggle");
          saveStandaloneTodos(standaloneTodos.map(t => t.id === id ? { ...t, done: !t.done } : t));
        });
      });
      document.querySelectorAll("[data-standalone-todo-remove]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-standalone-todo-remove");
          saveStandaloneTodos(standaloneTodos.filter(t => t.id !== id));
        });
      });
    }

    const addStandaloneTodoForm = document.getElementById("addStandaloneTodoForm");
    if (addStandaloneTodoForm) {
      addStandaloneTodoForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("newStandaloneTodoInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        saveStandaloneTodos([...standaloneTodos, { id: uid("todo"), text, done: false }]);
      });
    }

    document.getElementById("addCategoryForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("newCategoryInput");
      const name = input.value.trim();
      if (!name) return;
      input.value = "";
      saveCategories([...categories, { id: uid("cat"), name, items: [], decidedId: null }]);
    });
  </script>
</body>
</html>
